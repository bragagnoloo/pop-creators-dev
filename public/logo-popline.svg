<svg xmlns="http://www.w3.org/2000/svg" width="520" height="72" viewBox="0 0 520 72">
  <defs>
    <linearGradient id="popline-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f06abc"/>
      <stop offset="50%"  stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="72" fill="#0a0a0f" rx="10"/>

  <!-- POPLINE – gradient pink -->
  <text
    x="24"
    y="50"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="38"
    letter-spacing="3"
    fill="url(#popline-grad)"
  >POPLINE</text>

  <!-- CREATORS – muted gray -->
  <text
    x="248"
    y="50"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="38"
    letter-spacing="3"
    fill="#8888a0"
  >CREATORS</text>
</svg>
